[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion"
version = "2.0.0"
description = "ORION: Autonomous Adaptive OS Agent"
authors = [{ name = "IRFAN" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # Core
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Async
    "aiofiles>=23.0",
    # State & Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    # Vector Memory
    "chromadb>=0.4",
    # LLM Clients
    "openai>=1.0",
    "anthropic>=0.20",
    "ollama>=0.1",
    # Web Framework
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
    # Browser Automation
    "playwright>=1.40",
    # Vision & Image
    "opencv-python>=4.8",
    "pillow>=10.0",
    # Voice
    "faster-whisper>=0.10",
    # Telegram
    "python-telegram-bot>=20.0",
    # System Monitoring
    "psutil>=5.9",
    "networkx>=3.0",
    "gitpython>=3.1",
    # Observability
    "structlog>=23.0",
    "prometheus-client>=0.17",
    # Crypto / Security
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
]
voice = [
    "pyaudio>=0.2",
    "pvporcupine>=3.0",
]
vision = [
    "easyocr>=1.7",
    "ultralytics>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
