# ORION Model Management Configuration v3.0
# Author: IRFAN

model_router:
  default_strategy: "cost_optimized"   # cost_optimized | latency_optimized | quality_first
  max_monthly_budget_usd: 50.0
  fallback_chain: ["cloud", "local_large", "local_small"]
  offline_fallback_chain: ["local_large", "local_small"]

# Local models via Ollama
local_models:
  provider: "ollama"
  base_url: "http://localhost:11434"
  models:
    - name: "llama3.1:8b"
      role: "general"
      context_window: 128000
      speed: "fast"
      quality: "good"
      benchmark_latency_ms: 800
    - name: "qwen2.5-coder:7b"
      role: "coding"
      context_window: 32768
      speed: "fast"
      quality: "good"
      benchmark_latency_ms: 900
    - name: "phi3:mini"
      role: "fast_response"
      context_window: 4096
      speed: "very_fast"
      quality: "acceptable"
      benchmark_latency_ms: 200
    - name: "llava:7b"
      role: "vision"
      context_window: 4096
      speed: "medium"
      quality: "good"
      benchmark_latency_ms: 1500
    - name: "deepseek-r1:7b"
      role: "reasoning"
      context_window: 32768
      speed: "medium"
      quality: "excellent"
      benchmark_latency_ms: 2000
    - name: "nomic-embed-text"
      role: "embedding"
      context_window: 8192
      speed: "very_fast"
      quality: "good"
      benchmark_latency_ms: 100

# Cloud models
cloud_models:
  - provider: "anthropic"
    model: "claude-3-5-sonnet-20241022"
    role: "complex_coding"
    api_key_env: "ANTHROPIC_API_KEY"
    max_tokens: 8192
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
  - provider: "openai"
    model: "gpt-4o"
    role: "general_cloud"
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 4096
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
  - provider: "openai"
    model: "gpt-4o-mini"
    role: "fast_cloud"
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 4096
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
  - provider: "openai"
    model: "text-embedding-3-small"
    role: "embedding_cloud"
    api_key_env: "OPENAI_API_KEY"
    cost_per_1k_input: 0.00002

# Task routing — which model handles which task type
task_routing:
  simple_chat:        { primary: "local:llama3.1:8b",          offline: "local:llama3.1:8b" }
  complex_coding:     { primary: "cloud:claude-3-5-sonnet",     offline: "local:qwen2.5-coder:7b" }
  fast_response:      { primary: "local:phi3:mini",             offline: "local:phi3:mini" }
  vision:             { primary: "local:llava:7b",              offline: "local:llava:7b",      cloud_fallback: "cloud:gpt-4o" }
  vision_ocr_only:    { primary: "local:easyocr",               offline: "local:easyocr",       cloud_fallback: "cloud:gpt-4o-mini" }
  research:           { primary: "cloud:gpt-4o",                offline: "local:llama3.1:8b" }
  summarization:      { primary: "local:qwen2.5-coder:7b",      offline: "local:qwen2.5-coder:7b" }
  reasoning:          { primary: "local:deepseek-r1:7b",        offline: "local:deepseek-r1:7b" }
  embedding:          { primary: "local:nomic-embed-text",      offline: "local:nomic-embed-text", cloud_fallback: "cloud:text-embedding-3-small" }

# Vision fallback policy
vision_fallback:
  no_gpu: "cloud_ocr"         # use cloud OCR if no GPU
  offline: "local_easyocr"    # use local EasyOCR if offline
  low_memory: "disabled"      # disable vision if RAM < 2GB

retry:
  max_retries: 3
  backoff_base_seconds: 2
  backoff_multiplier: 2

timeout:
  local_model_seconds: 120
  cloud_model_seconds: 60
