[package]
name = "orion-rs"
version = "0.1.0"
edition = "2021"
description = "ORION Rust Performance Layer - Process Monitor & File Watcher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"          # File system watching
sysinfo = "0.30"      # System/process info
